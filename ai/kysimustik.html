      var sel = Array.isArray(cur)?cur.slice():[];
      s.o.forEach(function(o){
        var v = typeof o==="string"?o:o.v;   // options can be {v: stored value, t: title, d: one line under it}
        var b = el("button","opt"+(typeof o==="string"?(o.length>34?" long":""):" card")+(s.multi?" multi":"")+(sel.indexOf(v)>-1?" on":"")); b.type="button";
        var tx = el("span","txt"); if(typeof o==="string") tx.textContent=o; else { tx.appendChild(el("b","",o.t)); tx.appendChild(el("span","sub",o.d)); } b.appendChild(tx);
        b.onclick = function(){
          if(s.multi){ var k=sel.indexOf(v); if(k>-1) sel.splice(k,1); else sel.push(v); b.classList.toggle("on"); A[s.k]=sel.slice(); next.disabled=!sel.length; }
          else if(v==="Muu"){ A[s.k]="Muu"; [].forEach.call(box.children,function(x){x.classList.toggle("on",x===b)}); showOther(); }
          else { A[s.k]=v; setTimeout(go,180); [].forEach.call(box.children,function(x){x.classList.toggle("on",x===b)}); }
        };
        box.appendChild(b);
      });
      if(!s.multi) next=null; else next.disabled=!sel.length, next.onclick=go;
      if(oth!==null) showOther(oth);
    }
    if(next) foot.appendChild(next);
  }
  function go(){ i++; render(); window.scrollTo(0,0); px("trackCustom","AIQuizStep",{n:i+1}) }
  back.onclick = function(){ if(i>0 && !done){ i--; render(); } };
  function send(){
    var d = {}; Q.forEach(function(s){ if(!s.contact) d[s.k] = Array.isArray(A[s.k])?A[s.k].join(", "):(A[s.k]||""); });
    d.Nimi=A.Nimi; d.Email=A.Email; d.Telefon=A.Telefon; d.Allikas="inimai-kysimustik"; px("track","SubmitApplication");
    if(!RECEIVER_URL) return;
    try{ fetch(RECEIVER_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(d)}) }catch(e){}
  }
  function thanks(){
    done=true; i=Q.length; nodes(); $("bar").firstChild.style.width="100%"; $("step").textContent=""; back.hidden=true; foot.innerHTML="";
    q.innerHTML=""; q.className="q thanks";
    var nm=(A.Nimi||"").split(" ")[0];
    q.appendChild(el("h1","","Aitäh"+(nm?", "+nm:"")+"."));
    q.appendChild(el("p","lead","Siin on, mida Sa ütlesid:"));
    var L={"Valik":"Aega võidame","AI tase":"AI kogemus","Meeskond":"Meeskond","Äri":"Äri","Tunnid":"Arvutis päevas","Arvuti":"Arvuti","Eelarve":"Lahendus","30 päeva":"Muutus 30 päevaga"}, dl=el("dl","sum"), lines=[];
    Q.forEach(function(s){ if(s.contact) return; var v=Array.isArray(A[s.k])?A[s.k].join(", "):(A[s.k]||""); if(!v) return;
      var r=el("div"); r.appendChild(el("dt","",L[s.k]||s.k)); r.appendChild(el("dd","",v)); dl.appendChild(r); lines.push((L[s.k]||s.k)+": "+v); });
    q.appendChild(dl);
    var pk=Array.isArray(A.Valik)?A.Valik:[];
    q.appendChild(el("p","concl", pk.length?"Sinu järeldus: suurim ajavõit peitub siin: "+pk.join(", ").toLowerCase()+". Alustame sealt.":"Sinu järeldus: alustame sellest, mis Sind kõige rohkem kurnab."));
    q.appendChild(el("p","wise","Ära tee rohkem. Tee õigemat. Ülejäänu anna agentidele."));
    if(WA_NR){   // they write to Hendrik, with their own summary prefilled (8.11)
      var msg="Tere Hendrik! Täitsin InimAI küsimustiku"+(A.Nimi?" ("+A.Nimi+")":"")+".\n"+lines.join("\n")+"\nKirjutan, et leida järgmine samm.";
      var a=el("a","btn wa","KIRJUTA HENDRIKULE WHATSAPPI"); a.href="https://wa.me/"+WA_NR+"?text="+encodeURIComponent(msg.slice(0,900)); a.target="_blank"; a.rel="noopener";
      a.addEventListener("click",function(){ px("trackCustom","AIQuizWhatsApp") }); q.appendChild(a);
    } else q.appendChild(el("p","lead","Hendrik võtab Sinuga ühendust."));
  }
  render();
})();
</script>
