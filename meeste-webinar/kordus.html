html,body{background:#111217}
.pg{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 16px 28px;background:radial-gradient(60% 45% at 50% 30%,rgba(223,229,235,.06),transparent 70%),#111217}
.pg .kick{border:0;background:none;padding:0;border-radius:0;display:block;max-width:100%;white-space:normal;font-size:clamp(13px,1.6vw,16px);letter-spacing:.06em;text-transform:none;font-weight:600;color:var(--mut);margin:0 0 14px}

.pg .when{margin:26px 0 8px;border-radius:99px;padding:12px 20px;justify-content:center}
.pg .when i{box-shadow:0 0 12px var(--acc);animation:ld 2s ease-in-out infinite}
@keyframes ld{50%{opacity:.35}}
.cd{display:flex;gap:10px;margin:10px 0 24px;justify-content:center}
.cd div{min-width:68px;padding:10px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.cd b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.cd span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pg .btn{border-radius:99px;box-shadow:0 8px 34px -6px rgba(239,35,60,.75);padding:16px 34px}
@media(max-width:480px){.cd{gap:6px}.cd div{min-width:0;flex:1;max-width:84px}.cd b{font-size:26px}.cd span{font-size:10px;letter-spacing:.04em}.pg .when{font-size:15px}}
.pbg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#111217}
.pbg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 30%}
.pbg:after{content:"";position:absolute;inset:0;background:rgba(17,18,23,.72)}
@media(min-width:768px){.pbg video{left:50%;right:auto;width:auto;aspect-ratio:760/1084;transform:translateX(-50%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent)}}
.pg{position:relative;z-index:1;background:none!important}
