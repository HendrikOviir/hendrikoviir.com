.lead{text-align:center;color:var(--mut);margin:0 auto 18px;max-width:30em;font-size:16px;text-wrap:balance}
.lead:empty{display:none}
.stp{position:relative;display:flex;justify-content:space-between;margin:6px 4px 24px}
.stp:before{content:"";position:absolute;left:16px;right:16px;top:14px;height:2px;background:var(--line)}
.stp .fill{position:absolute;left:16px;top:14px;height:2px;background:var(--acc);transition:width .4s ease;width:0}
.st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;width:60px}
.st i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 13px/1 inherit;font-style:normal;background:var(--bg2);border:2px solid var(--line);color:var(--mut)}
.st b{font-size:11px;font-weight:600;color:var(--mut);white-space:nowrap}
.st.done i{background:var(--acc);border-color:var(--acc);color:var(--cta)}
.st.now i{border-color:var(--acc);color:var(--ink)}
.st.now b{color:var(--ink)}
.step{display:none}.step.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
label.q{display:block;font-weight:700;font-size:17px;line-height:1.35;margin:20px 0 8px}
label.q:first-child{margin-top:0}
.hint{display:block;font-weight:400;font-size:14px;color:var(--mut);margin-top:3px}
textarea{width:100%;min-height:56px;resize:vertical;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
textarea:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.meter{margin-top:18px}.meter .top{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.meter b{color:var(--acc);font-size:22px;font-weight:800}
.meter input[type=range]{width:100%;height:auto;min-height:32px;margin:6px 0 2px;accent-color:var(--acc)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.gapn{text-align:center;margin:16px 0 4px}.gapn b{display:block;font-size:48px;line-height:1;font-weight:800;color:var(--acc)}.gapn span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.areas,.opts{display:grid;gap:10px}.areas{grid-template-columns:1fr 1fr}
.areas button,.opts button{all:unset;box-sizing:border-box;cursor:pointer;padding:16px 14px;min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;text-align:center;display:flex;align-items:center;justify-content:center}
.opts button{justify-content:flex-start;text-align:left}
.areas button:focus-visible,.opts button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.areas button.on,.opts button.on{border-color:var(--acc);background:rgba(239,35,60,.12)}
.nav{display:flex;gap:10px;margin-top:24px}
.nav .btn{flex:1}.nav .btn.back{flex:0 0 64px;padding:14px 0}
.btn:disabled{opacity:.4;cursor:default}
.hp{position:absolute;left:-9999px}
.done{text-align:center}
.sgoal{text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--acc);background:rgba(239,35,60,.08)}
.sgoal small,.sum small{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stats div{padding:12px 6px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.stats b{display:block;font-size:20px;font-weight:800}.stats small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.more{all:unset;cursor:pointer;display:block;margin:16px auto 0;color:var(--mut);font-weight:600;font-size:14px;min-height:44px}
.sum{text-align:left;display:grid;gap:8px}.sum[hidden]{display:none}.sum div{padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.err{color:var(--acc);font-size:14px;min-height:1em;margin-top:10px;text-align:center}

<main>
  <span class="kick">Meeste tervise kuu webinar</span>
  <div class="stp" id="stp"><div class="fill" id="fill"></div>
    <div class="st"><i>1</i><b>Fookus</b></div><div class="st"><i>2</i><b>Siht</b></div><div class="st"><i>3</i><b>Distants</b></div><div class="st"><i>4</i><b>Takistused</b></div><div class="st"><i>5</i><b>Tahe</b></div>
  </div>
  <h1 id="h"></h1>
  <p class="lead" id="lead"></p>
  <div class="card">
    <section class="step on">
      <label class="q" style="margin-top:0">Mis on Su peamine eesmärk?</label>
      <div class="areas" id="c-area"><button data-v="rasv">Rasv alla</button><button data-v="lihas">Lihaste kasv</button></div>
      <label class="q">Hetkeolukord kehas</label>
      <div class="opts" id="c-body"><button data-v="suur">Suur ülekaal</button><button data-v="mood">Mõõdukas ülekaal</button><button data-v="kaetud">Lihast on, rasv katab selle ära</button><button data-v="kohn">Kõhn</button><button data-v="kasvataks">Lihast on, kasvataks veel</button></div>
    </section>

    <section class="step">
      <label class="q" for="f-goal">Mis vormis oled 90 päeva pärast?<span class="hint">Kirjuta nii, nagu see oleks juba tõsi. Kaal, lihas, kõht, jõud.</span></label><textarea id="f-goal" maxlength="300"></textarea>
      <label class="q" for="f-life">Mismoodi Su elu siis muutuks?<span class="hint">Peeglis, töös, suhetes, enesekindluses.</span></label><textarea id="f-life" maxlength="300"></textarea>
      <label class="q" for="f-pain">Mis on trenni ja toitumise juures praegu kõige raskem?</label><textarea id="f-pain" maxlength="300"></textarea>
      <div class="nav"><button class="btn ghost back" data-back>←</button><button class="btn" data-next>Edasi</button></div>
    </section>

    <section class="step">
      <div class="meter"><div class="top"><label for="r-now">Kui rahul oled oma vormiga täna?</label><b id="r-now-v">4</b></div><input type="range" id="r-now" min="1" max="10" value="4"><div class="ends"><span>kaugel</span><span>kohal</span></div></div>
      <div class="meter"><div class="top"><label for="r-want">Kus tahaksid olla 90 päeva pärast?</label><b id="r-want-v">9</b></div><input type="range" id="r-want" min="1" max="10" value="9"><div class="ends"><span>kaugel</span><span>kohal</span></div></div>
      <div class="gapn"><b id="gap-n">5</b><span>sammu vahet</span></div>
      <label class="q" for="f-gap">Mis saab võimalikuks, kui oled selles vormis?<span class="hint">Mida teed teisiti, mida julged, mida saad?</span></label><textarea id="f-gap" maxlength="300"></textarea>
      <div class="nav"><button class="btn ghost back" data-back>←</button><button class="btn" data-next>Edasi</button></div>
    </section>

    <section class="step">
      <div class="meter" style="margin-top:0"><div class="top"><label for="r-time">Trenne nädalas praegu</label><b id="r-time-v">2 korda</b></div><input type="range" id="r-time" min="0" max="7" value="2"><div class="ends"><span>0</span><span>7</span></div></div>
      <div class="meter"><div class="top"><label for="r-energy">Energia tavalisel päeval</label><b id="r-energy-v">5</b></div><input type="range" id="r-energy" min="1" max="10" value="5"><div class="ends"><span>vähe</span><span>palju</span></div></div>
      <label class="q" for="f-drain">Mis takistab Sul regulaarselt trenni tegemast ja hästi söömast?</label><textarea id="f-drain" maxlength="300"></textarea>
      <div class="meter"><div class="top"><label for="r-people">Uni tavalisel ööl</label><b id="r-people-v">7 h</b></div><input type="range" id="r-people" min="4" max="10" value="7"><div class="ends"><span>4 h</span><span>10 h</span></div></div>
      <label class="q">Kas Sul on vabu vahendeid, mida soovi korral oma tervisesse ja vormi investeerida?</label>
      <div class="opts" id="c-money"><button data-v="jah">Jah, vahendid on olemas</button><button data-v="umber">On, kuid piiratud hulgal</button><button data-v="ei">Praegu mitte</button></div>
      <div class="nav"><button class="btn ghost back" data-back>←</button><button class="btn" data-next>Edasi</button></div>
    </section>

    <section class="step">
      <div class="meter" style="margin-top:0"><div class="top"><label for="r-will">Kui väga Sa seda päriselt tahad?</label><b id="r-will-v">7</b></div><input type="range" id="r-will" min="1" max="10" value="7"><div class="ends"><span>proovin</span><span>teen ära</span></div></div>
      <label class="q" for="f-ready">Mida Sa tunned? Millal Sa selle valid?<span class="hint">Millal oled selleks valmis?</span></label><textarea id="f-ready" maxlength="300"></textarea>
      <label class="q" for="f-name">Eesnimi</label><input type="text" id="f-name" maxlength="60" autocomplete="given-name">
      <label class="q" for="f-email">E-post</label><input type="email" id="f-email" maxlength="120" autocomplete="email">
      <label class="q" for="f-phone">Telefon<span class="hint">Soovi korral</span></label><input type="tel" id="f-phone" maxlength="30" autocomplete="tel">
      <label class="q">Kuidas soovid jätkata?</label>
      <div class="opts" id="c-next"><button data-v="kohe">Liitun kohe</button><button data-v="video">Videokõne</button><button data-v="telefon">Telefonikõne</button><button data-v="tekst">Tekst / e-kiri</button><button data-v="aeg">Vajan aega / FB grupp</button></div>
      <input type="text" class="hp" id="r-hp" name="hp_k7" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="err" id="err" role="alert"></p>
      <div class="nav"><button class="btn ghost back" data-back>←</button><button class="btn" id="send" disabled>Kinnitan</button></div>
    </section>

    <section class="step done" id="s-done">
      <div class="sgoal"><small id="s-area"></small><span id="s-goal"></span></div>
      <div class="stats"><div><b id="s-dist"></b><small>Distants</small></div><div><b id="s-en"></b><small>Energia</small></div><div><b id="s-will"></b><small>Tahe</small></div></div>
      <p class="fine" style="margin-top:16px" id="s-next">Aitäh. Hendrik võtab Sinuga peagi ühendust.</p><a class="btn" id="s-shop" href="pakkumine.html" style="display:none;text-align:center;margin-top:12px">Vaata pakkumist</a>
      <button class="more" id="more" type="button">Kõik vastused ▾</button>
      <div class="sum" id="sum" hidden></div>
    </section>
  </div>
</main>

<script src="joux.js?v=8"></script>
<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbw5D-Vmuu6p7GuTzK2Da1_aQB_HC3YRmlif4WFjPngDvDw9AcxFDUwle_s9_FN0TtEo/exec";
const $ = id => document.getElementById(id), val = id => $(id).value.trim();
const emailOk = s => /^[^\s@]{1,64}@[^\s@]{1,190}\.[a-z]{2,24}$/i.test(s);
const Q = new URLSearchParams(location.search);
const HEAD = [
  ["Sinu fookus", "Vali eesmärk ja kus Su keha täna on."],
  ["Sinu siht", "Milline vorm ootab Sind 90 päeva pärast ja miks see Sulle oluline on?"],
  ["Distants Sinu sihini", "Kui kaugel see täna on ja mida see vahe Sult võtab?"],
  ["Mis Sind tagasi hoiab", "Trenn, energia, uni ja raha. Nähtav takistus on ületatav."],
  ["Sinu tahe", "See on võimalik, kui see on Sulle tõeliselt oluline."],
  ["Kokkuvõte", ""]];
let area = "", body = "", money = "", nextc = "", cur = 0;
const steps = [...document.querySelectorAll(".step")], dots = [...document.querySelectorAll(".st")];
const need = [() => area && body, () => val("f-goal") && val("f-life") && val("f-pain"), () => val("f-gap"), () => money && val("f-drain"), () => val("f-ready") && val("f-name") && emailOk(val("f-email")) && nextc];
function refresh(){ steps.forEach((s, k) => { const b = s.querySelector("[data-next]"); if (b) b.disabled = !need[k](); }); $("send").disabled = !need[4](); }
function show(i){ cur = i; steps.forEach((s, k) => s.classList.toggle("on", k === i));
  dots.forEach((d, k) => { d.classList.toggle("done", k < i); d.classList.toggle("now", k === i); d.querySelector("i").textContent = k < i ? "✓" : k + 1; });
  $("fill").style.width = "calc((100% - 32px) * " + Math.min(i, 4) / 4 + ")";
  $("h").textContent = HEAD[i][0]; $("lead").textContent = HEAD[i][1]; refresh(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function chooser(id, set){ const box = $(id); box.querySelectorAll("button").forEach(b => b.onclick = () => { box.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); set(b.dataset.v); refresh(); }); }
const auto1 = () => setTimeout(() => { if (cur === 0 && area && body) show(1); }, 300);
chooser("c-area", v => { area = v; auto1(); }); chooser("c-body", v => { body = v; auto1(); }); chooser("c-money", v => money = v); chooser("c-next", v => nextc = v);
const gap = () => { $("gap-n").textContent = Math.max(0, $("r-want").value - $("r-now").value); };
["now","want","energy","will"].forEach(k => { const r = $("r-" + k); r.oninput = () => { $("r-" + k + "-v").textContent = r.value; gap(); }; });
$("r-people").oninput = () => $("r-people-v").textContent = $("r-people").value + " h";
const hrs = n => n == 1 ? "1 kord" : n + " korda"; $("r-time").oninput = () => $("r-time-v").textContent = hrs(+$("r-time").value);
document.querySelectorAll("[data-next]").forEach(b => b.onclick = () => show(cur + 1));
document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => show(cur - 1));
document.addEventListener("input", e => { if (e.target.tagName === "TEXTAREA") { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + 2 + "px"; } refresh(); });
(function(){ const e = Q.get("e"); if (e && emailOk(e)) $("f-email").value = e; })();
const AREA = { rasv: "Rasv alla", lihas: "Lihaste kasv" }, BODY = { suur: "Suur ülekaal", mood: "Mõõdukas ülekaal", kaetud: "Lihast on, rasv katab selle ära", kohn: "Kõhn", kasvataks: "Lihast on, kasvataks veel" }, NEXT = { kohe: "Liitun kohe", video: "Videokõne", telefon: "Telefonikõne", tekst: "Tekst / e-kiri", aeg: "Vajan aega / FB grupp" }, MONEY = { jah: "Jah, vahendid on olemas", umber: "On, kuid piiratud hulgal", ei: "Praegu mitte" };
$("send").onclick = () => {
  if ($("send").disabled || $("send").dataset.sent) return; $("send").dataset.sent = "1"; $("send").disabled = true;
  const src = Q.get("src") || Q.get("utm_source") || "email";
  const d = { Nimi: val("f-name"), Email: val("f-email"), Telefon: val("f-phone"), Allikas: "meeste-webinar-27-11 · tooleht · " + src, Valik: "tooleht mehed",
    "Eesmärk": AREA[area], "Keha": BODY[body], "Siht 90p": val("f-goal"), "Elu siis": val("f-life"), "Kõige raskem": val("f-pain"), "Rahul vormiga": +$("r-now").value, "Soov 90p": +$("r-want").value,
    "Mis saab võimalikuks": val("f-gap"), "Trenne nädalas": +$("r-time").value, "Energia": +$("r-energy").value, "Takistus": val("f-drain"), "Uni (h)": +$("r-people").value,
    "Vahendid": MONEY[money], "Tahe": +$("r-will").value, "Valmis": val("f-ready"), "Jätkamine": NEXT[nextc], hp_k7: val("r-hp") };
  if (!d.hp_k7) { try { fetch(ENDPOINT, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain" }, body: JSON.stringify(d) }); } catch (x) {} }
  const rows = [["Eesmärk", d["Eesmärk"]], ["Keha", d["Keha"]], ["Siht 90 päeva pärast", d["Siht 90p"], "goal"], ["Elu siis", d["Elu siis"]], ["Kõige raskem trennis ja toidus", d["Kõige raskem"]],
    ["Vormiga rahul", d["Rahul vormiga"] + " → " + d["Soov 90p"] + " (" + Math.max(0, d["Soov 90p"] - d["Rahul vormiga"]) + " sammu)"], ["Mis saab võimalikuks", d["Mis saab võimalikuks"]],
    ["Trenne nädalas", hrs(d["Trenne nädalas"])], ["Energia", d["Energia"] + "/10"], ["Takistus", d["Takistus"]], ["Uni", d["Uni (h)"] + " h"], ["Vahendid", d["Vahendid"]],
    ["Tahe", d["Tahe"] + "/10"], ["Valmis", d["Valmis"]], ["Jätkamine", d["Jätkamine"]]];
  $("sum").innerHTML = rows.map(r => '<div><small>' + r[0] + '</small><span></span></div>').join("");
  [...$("sum").querySelectorAll("span")].forEach((el, k) => el.textContent = rows[k][1]);
  $("s-area").textContent = d["Eesmärk"]; $("s-goal").textContent = d["Siht 90p"];
  $("s-dist").textContent = d["Rahul vormiga"] + " → " + d["Soov 90p"]; $("s-en").textContent = d["Energia"] + "/10"; $("s-will").textContent = d["Tahe"] + "/10";
  $("more").onclick = () => { const h = $("sum").hidden; $("sum").hidden = !h; $("more").textContent = h ? "Peida ▴" : "Kõik vastused ▾"; };
  if (nextc === "kohe") $("s-shop").style.display = "block"; setTimeout(() => show(5), 300);
};
show(0);
</script></body></html>
